<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Sign Up | Corte Navigation</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

  <style>
    /* gacuti.kethia */
    :root {
        --bg-dark: #0e1012;
        --bg-card: #17191c;
        --bg-input: #23262b;
        --text-main: #ffffff;
        --text-muted: #9ca3af;
        --primary: #007afc;
        --primary-hover: #0062ca;
        --border: #2b2f36;
        --error: #ef4444;
        --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-dark);
        color: var(--text-main);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
    }
    .bg-pattern {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: 
            linear-gradient(var(--bg-dark) 2px, transparent 2px),
            linear-gradient(90deg, var(--bg-dark) 2px, transparent 2px),
            linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 40px 40px, 40px 40px;
        z-index: -1;
    }

    .auth-card {
        width: 100%;
        max-width: 400px;
        padding: 40px;
        background: rgba(23, 25, 28, 0.85);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        text-align: center;
    }

    .logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-weight: 700;
        font-size: 1.2rem;
        margin-bottom: 32px;
        color: var(--text-main);
    }
    .logo i { color: var(--primary); }
    .logo span { color: var(--primary); }

    h2 {
        margin-bottom: 8px;
        font-size: 1.5rem;
        letter-spacing: -0.5px;
    }

    .subtitle {
        color: var(--text-muted);
        font-size: 0.9rem;
        margin-bottom: 24px;
    }

    .input-group {
        position: relative;
        margin-bottom: 16px;
        text-align: left;
    }

    .input-group i {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        font-size: 0.9rem;
        pointer-events: none;
    }

    input {
        width: 100%;
        padding: 12px 12px 12px 40px;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text-main);
        font-size: 0.95rem;
        transition: border-color 0.2s;
    }

    input:focus {
        outline: none;
        border-color: var(--primary);
    }

    input::placeholder {
        color: #555;
    }

    button {
        width: 100%;
        padding: 12px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 50px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        margin-top: 8px;
        transition: all 0.2s;
    }

    button:hover {
        background: var(--primary-hover);
        transform: translateY(-1px);
    }

    button:active {
        transform: scale(0.98);
    }

    button:disabled {
        background: var(--bg-input);
        color: var(--text-muted);
        cursor: not-allowed;
        transform: none;
    }

    /* --- FOOTER AND STATUS MESSAGES --- */
    .meta {
        margin-top: 24px;
        font-size: 0.9rem;
        color: var(--text-muted);
    }

    a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 500;
    }

    a:hover {
        text-decoration: underline;
    }

    .status-msg {
        font-size: 0.85rem;
        margin-top: 12px;
        min-height: 20px;
        font-weight: 500;
    }
    .error { color: var(--error); }
    .success { color: var(--success); }
  </style>
</head>
<body>

  <div class="bg-pattern"></div>

  <div class="auth-card">
    <div class="logo">
        <i class="fa-solid fa-layer-group"></i> Corte<span>Navigation</span>
    </div>
    
    <h2>Create Account</h2>
    <p class="subtitle">Join the community mapping Accra.</p>

    <div class="input-group">
        <i class="fa-regular fa-user"></i>
        <input type="text" id="username" placeholder="Choose a Username (3-50 chars)" required>
    </div>

    <div class="input-group">
        <i class="fa-regular fa-envelope"></i>
        <input type="email" id="email" placeholder="Your Gmail Address" required>
    </div>

    <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="password" placeholder="Create Password (8+ characters)" required>
    </div>

    <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="confirm_password" placeholder="Confirm Password" required>
    </div>

    <button id="signupBtn">Sign Up</button>
    
    <div id="statusMsg" class="status-msg"></div>

    <p class="meta">
        Already have an account? <a href="login.html">Log in</a>
    </p>
  </div>

  <script>
    const MIN_PASS_LENGTH = 8;
    const MIN_USER_LENGTH = 3;
    const MAX_USER_LENGTH = 50;
    const GMAIL_REGEX = /^[^\s@]+@gmail\.com$/;
    const USERNAME_REGEX = /^[a-zA-Z0-9_]{3,50}$/; 

    document.getElementById("signupBtn").addEventListener("click", async () => {
      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const pass = document.getElementById("password").value;
      const confirmPass = document.getElementById("confirm_password").value;
      
      const statusDiv = document.getElementById("statusMsg");
      const btn = document.getElementById("signupBtn");

      
      if (!username || !email || !pass || !confirmPass) {
          statusDiv.className = "status-msg error";
          statusDiv.textContent = "All fields are required.";
          return;
      }
      
      if (!USERNAME_REGEX.test(username)) {
          statusDiv.className = "status-msg error";
          statusDiv.textContent = "Username must be 3-50 characters, using only letters, numbers, or underscores.";
          return;
      }

    
      if (!GMAIL_REGEX.test(email)) {
          statusDiv.className = "status-msg error";
          statusDiv.textContent = "Please enter a valid Gmail address (e.g., user@gmail.com).";
          return;
      }

      if (pass !== confirmPass) {
          statusDiv.className = "status-msg error";
          statusDiv.textContent = "Passwords do not match.";
          return;
      }

      if (pass.length < MIN_PASS_LENGTH) {
          statusDiv.className = "status-msg error";
          statusDiv.textContent = `Password must be at least ${MIN_PASS_LENGTH} characters long.`;
          return;
      }


      btn.textContent = "Creating Account...";
      btn.disabled = true;
      statusDiv.textContent = "";

      try {
        const res = await fetch('signup.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
              username: username, 
              email: email, 
              password: pass 
          })
        });
        
        const contentType = res.headers.get("content-type");
        if (!contentType || !contentType.includes("application/json")) {
            throw new Error("Server returned invalid response");
        }

        const data = await res.json();

        if (data.status === "success") {
          statusDiv.className = "status-msg success";
          statusDiv.textContent = "Account created successfully! Redirecting to login...";
          btn.style.background = "var(--success)";
          btn.textContent = "Success!";
          
          setTimeout(() => {
              window.location.href = "login.html";
          }, 1500);
        } else {
          statusDiv.className = "status-msg error";
          statusDiv.textContent = data.message || "Signup failed. Please try again.";
          btn.textContent = "Sign Up";
          btn.disabled = false;
        }
      } catch (err) {
        console.error(err);
        statusDiv.className = "status-msg error";
        statusDiv.textContent = "Connection failed. Please try again.";
        btn.textContent = "Sign Up";
        btn.disabled = false;
      }
    });


    document.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            document.getElementById('signupBtn').click();
        }
    });
  </script>
</body>
</html>
