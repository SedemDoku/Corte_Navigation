<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Set New Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

  <style>
    :root {
        --bg-dark: #0e1012;
        --bg-card: #17191c;
        --bg-input: #23262b;
        --text-main: #ffffff;
        --text-muted: #9ca3af;
        --primary: #007afc;
        --primary-hover: #386ca4;
        --border: #2b2f36;
        --error: #ef4444;
        --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-dark);
        color: var(--text-main);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
    }

    /* Abstract Map Background Pattern */
    .bg-pattern {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: 
            linear-gradient(var(--bg-dark) 2px, transparent 2px),
            linear-gradient(90deg, var(--bg-dark) 2px, transparent 2px),
            linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 40px 40px, 40px 40px;
        z-index: -1;
    }

    .auth-card {
        width: 100%;
        max-width: 400px;
        padding: 40px;
        background: rgba(23, 25, 28, 0.85); 
        backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        text-align: center;
    }

    h2 {
        margin-bottom: 8px;
        font-size: 1.5rem;
        letter-spacing: -0.5px;
    }

    .subtitle {
        color: var(--text-muted);
        font-size: 0.9rem;
        margin-bottom: 24px;
    }

    .input-group {
        position: relative;
        margin-bottom: 16px;
        text-align: left;
    }

    .input-group i {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        font-size: 0.9rem;
        pointer-events: none;
    }

    input {
        width: 100%;
        padding: 12px 12px 12px 40px; /* space for icon */
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text-main);
        font-size: 0.95rem;
        transition: border-color 0.2s;
    }

    input:focus {
        outline: none;
        border-color: var(--primary);
    }

    button {
        width: 100%;
        padding: 12px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 50px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        margin-top: 8px;
        transition: background 0.2s, transform 0.1s;
    }

    button:hover {
        background: var(--primary-hover);
    }

    button:active {
        transform: scale(0.98);
    }

    button:disabled {
        background: var(--border);
        color: var(--text-muted);
        cursor: not-allowed;
    }

    .error {
        color: var(--error);
        font-size: 12px;
        margin-top: 12px;
        min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="bg-pattern"></div>
  <div class="auth-card">
    <h2>Set New Password</h2>
    <p class="subtitle">Enter your new password below.</p>

    <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="newPass" placeholder="New Password">
    </div>
    <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="confirmPass" placeholder="Confirm Password">
    </div>

    <button id="updateBtn">Update Password</button>
    
    <div id="errorMsg" class="error"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const error = document.getElementById("errorMsg");

    if (!token) {
        document.querySelector('.auth-card').innerHTML = "<h2>Error</h2><p class='subtitle'>The reset link is invalid or missing. Please return to the login page and request a new one.</p>";
        // Prevent script from running further if no token is present
        throw new Error("Missing Token"); 
    }

    document.getElementById("updateBtn").addEventListener("click", async () => {
        const pass = document.getElementById("newPass").value;
        const confirm = document.getElementById("confirmPass").value;
        const btn = document.getElementById("updateBtn");
        error.textContent = "";

        // Client-side Validation
        if (pass.length < 8) { 
            error.textContent = "Password must be at least 8 characters."; 
            return; 
        }
        if (pass !== confirm) { 
            error.textContent = "Passwords do not match."; 
            return; 
        }

        btn.textContent = "Updating...";
        btn.disabled = true;

        try {
            const res = await fetch('update_password.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token, password: pass })
            });
            const data = await res.json();

            if (data.status === "success") {
                btn.style.background = "var(--success)"; // Use the green success color
                btn.textContent = "Password Updated!";
                // Redirect user to login page after success
                setTimeout(() => window.location.href = "login.html", 1500);
            } else {
                error.textContent = data.message;
                btn.textContent = "Update Password";
                btn.disabled = false;
            }
        } catch (err) {
            error.textContent = "Connection failed. Please check your network.";
            btn.textContent = "Update Password";
            btn.disabled = false;
        }
    });
  </script>
</body>
</html>
