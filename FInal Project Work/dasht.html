<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Corte Dashboard | Navigation</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  
  <style>
    :root {
        --bg-dark: #0e1012;
        --bg-panel: #17191c;
        --bg-input: #23262b;
        --text-main: #ffffff;
        --text-muted: #9ca3af;
        --primary: #007afc;
        --primary-hover: #0062ca;
        --border: #2b2f36;
        --shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    /* Basic Reset & Layout */
    body { 
        margin: 0; 
        font-family: 'Inter', sans-serif; 
        display: flex; 
        height: 100vh; 
        overflow: hidden; 
        background-color: var(--bg-dark);
        color: var(--text-main);
    }
    
    /* --- Sidebar --- */
    .sidebar { 
        width: 64px; 
        background: var(--bg-panel); 
        border-right: 1px solid var(--border); 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        padding-top: 24px; 
        z-index: 10; 
    }

    .nav-item { 
        width: 40px;
        height: 40px;
        margin-bottom: 16px; 
        cursor: pointer; 
        color: var(--text-muted); 
        border: none; 
        background: transparent;
        border-radius: 10px;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
    }

    .nav-item:hover { 
        background: var(--bg-input);
        color: var(--text-main); 
    }

    .nav-item.active {
        background: rgba(0, 122, 252, 0.15);
        color: var(--primary);
    }

    .nav-spacer { flex-grow: 1; }
    
    .profile-icon {
        width: 32px; 
        height: 32px; 
        background: var(--primary); 
        border-radius: 50%; 
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.8rem;
        font-weight: bold;
    }

    /* --- Floating Panel --- */
    .search-panel { 
        position: absolute; 
        top: 20px; 
        left: 84px; 
        width: 360px; 
        background: var(--bg-panel); 
        border: 1px solid var(--border);
        border-radius: 12px; 
        box-shadow: var(--shadow); 
        z-index: 5; 
        padding: 24px; 
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .logo { 
        color: var(--text-main); 
        font-weight: 700; 
        font-size: 1.1rem; 
        margin-bottom: 8px; 
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .logo span { color: var(--primary); }
    .logo i { color: var(--primary); font-size: 0.9rem;}
    
    /* Inputs */
    .input-group {
        position: relative;
    }
    
    .input-icon {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        font-size: 0.8rem;
    }

    input { 
        width: 100%; 
        padding: 12px 12px 12px 36px; 
        background: var(--bg-input);
        border: 1px solid var(--border); 
        border-radius: 8px; 
        box-sizing: border-box; 
        color: var(--text-main);
        font-family: inherit;
        font-size: 0.9rem;
        transition: border-color 0.2s;
    }

    input:focus {
        outline: none;
        border-color: var(--primary);
    }

    /* Button */
    button#searchBtn { 
        width: 100%; 
        padding: 12px; 
        background: var(--primary); 
        color: white; 
        border: none; 
        border-radius: 8px; 
        cursor: pointer; 
        font-weight: 600; 
        font-size: 0.95rem;
        transition: background 0.2s;
        margin-top: 8px;
    }

    button#searchBtn:hover { background: var(--primary-hover); }

    /* Results Area */
    #instructions { 
        margin-top: 10px; 
        max-height: 400px; 
        overflow-y: auto; 
        font-size: 0.9rem; 
        padding-right: 5px;
    }

    /* Scrollbar styling */
    #instructions::-webkit-scrollbar { width: 6px; }
    #instructions::-webkit-scrollbar-track { background: var(--bg-dark); }
    #instructions::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* Route Cards */
    .leg-card { 
        background: var(--bg-dark); 
        border: 1px solid var(--border);
        border-left: 4px solid var(--primary); 
        border-radius: 6px;
        padding: 12px 16px; 
        margin-bottom: 10px; 
    }
    
    .leg-header { font-weight: 600; color: var(--text-main); margin-bottom: 4px; display: block;}
    .leg-details { color: var(--text-muted); font-size: 0.85rem; }
    .leg-meta { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 0.8rem; color: var(--text-muted); }
    .badge { background: rgba(0,122,252,0.2); color: var(--primary); padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: 600;}
    .badge.transfer { background: rgba(255,165,0,0.2); color: #ffa500; } /* Orange for transfer */

    /* Map */
    #map { flex-grow: 1; height: 100%; }
    
    /* Feedback */
    #errorMsg { font-size: 0.85rem; margin-top: 5px; }
    
    /* Button group styles */
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    
    .secondary-btn {
      background: var(--bg-input);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    
    .secondary-btn:hover {
      background: var(--border);
      color: var(--text-main);
    }
    
    .secondary-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .secondary-btn i {
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <button class="nav-item" onclick="window.location.href='index.html'" title="Back to Home">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <button class="nav-item active" title="Navigation">
      <i class="fa-solid fa-location-arrow"></i>
    </button>
    <a href="my_routes.php" class="nav-item" title="Saved Routes">
      <i class="fa-regular fa-bookmark"></i>
    </a>
    <button class="nav-item" title="Settings">
      <i class="fa-solid fa-gear"></i>
    </button>
    
    <div class="nav-spacer"></div>
    
    <div class="profile-icon">CN</div>
  </aside>

  <div class="search-panel">
    <div class="logo"><i class="fa-solid fa-layer-group"></i> Corte<span>Navigation</span></div>
    
    <div class="input-group">
        <i class="fa-regular fa-circle input-icon" style="font-size: 0.6rem; color: #23c1e0;"></i>
        <input id="start" placeholder="Start Point (e.g. Mile 11)">
    </div>
    
    <div class="input-group">
        <i class="fa-solid fa-location-dot input-icon" style="color: #007afc;"></i>
        <input id="end" placeholder="Destination (e.g. 37 Hospital)">
    </div>

    <div class="button-group">
      <button id="searchBtn">Find Trotro Route</button>
      <button id="saveRouteBtn" class="secondary-btn" disabled>
        <i class="fa-regular fa-bookmark"></i> Save Route
      </button>
    </div>
    
    <div id="errorMsg"></div>
    <div id="instructions">
        </div>
  </div>

  <div id="map"></div>

  <script>
    let map, geocoder, currentPolyline, currentRouteData = null;
    let markers = []; // Array to hold all markers

    // Custom Dark Theme for Google Maps to match the UI
    const mapStyles = [
      { elementType: "geometry", stylers: [{ color: "#242f3e" }] },
      { elementType: "labels.text.stroke", stylers: [{ color: "#242f3e" }] },
      { elementType: "labels.text.fill", stylers: [{ color: "#746855" }] },
      { featureType: "administrative.locality", elementType: "labels.text.fill", stylers: [{ color: "#d59563" }] },
      { featureType: "poi", elementType: "labels.text.fill", stylers: [{ color: "#d59563" }] },
      { featureType: "poi.park", elementType: "geometry", stylers: [{ color: "#263c3f" }] },
      { featureType: "poi.park", elementType: "labels.text.fill", stylers: [{ color: "#6b9a76" }] },
      { featureType: "road", elementType: "geometry", stylers: [{ color: "#38414e" }] },
      { featureType: "road", elementType: "geometry.stroke", stylers: [{ color: "#212a37" }] },
      { featureType: "road", elementType: "labels.text.fill", stylers: [{ color: "#9ca5b3" }] },
      { featureType: "road.highway", elementType: "geometry", stylers: [{ color: "#746855" }] },
      { featureType: "road.highway", elementType: "geometry.stroke", stylers: [{ color: "#1f2835" }] },
      { featureType: "road.highway", elementType: "labels.text.fill", stylers: [{ color: "#f3d19c" }] },
      { featureType: "transit", elementType: "geometry", stylers: [{ color: "#2f3948" }] },
      { featureType: "transit.station", elementType: "labels.text.fill", stylers: [{ color: "#d59563" }] },
      { featureType: "water", elementType: "geometry", stylers: [{ color: "#17263c" }] },
      { featureType: "water", elementType: "labels.text.fill", stylers: [{ color: "#515c6d" }] },
      { featureType: "water", elementType: "labels.text.stroke", stylers: [{ color: "#17263c" }] }
    ];

    function initMap() {
      map = new google.maps.Map(document.getElementById("map"), {
        zoom: 13,
        center: { lat: 5.6037, lng: -0.1870 }, // Accra Center
        disableDefaultUI: false,
        styles: mapStyles, // Apply dark theme
        mapTypeControl: false,
        streetViewControl: false
      });
      geocoder = new google.maps.Geocoder();
    }

    // Handle saving route
    document.getElementById('saveRouteBtn').addEventListener('click', async function() {
      if (!currentRouteData) return;
      
      try {
        const response = await fetch('save_route.php', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            route_name: `Route from ${document.getElementById('start').value} to ${document.getElementById('end').value}`,
            start_lat: currentRouteData.start.lat,
            start_lng: currentRouteData.start.lng,
            end_lat: currentRouteData.end.lat,
            end_lng: currentRouteData.end.lng,
            route_data: currentRouteData
          })
        });
        
        const result = await response.json();
        
        if (response.ok) {
          alert('Route saved successfully!');
          // Update the button to show it's been saved
          const saveBtn = document.getElementById('saveRouteBtn');
          saveBtn.innerHTML = '<i class="fa-solid fa-check"></i> Saved';
          saveBtn.disabled = true;
        } else {
          throw new Error(result.message || 'Failed to save route');
        }
      } catch (error) {
        console.error('Error saving route:', error);
        alert('Failed to save route: ' + error.message);
      }
    });
    
    // Function to update the save button state
    function updateSaveButton(hasRoute) {
      const saveBtn = document.getElementById('saveRouteBtn');
      saveBtn.disabled = !hasRoute;
      if (hasRoute) {
        saveBtn.innerHTML = '<i class="fa-regular fa-bookmark"></i> Save Route';
      }
    }
    
    // Call this when a route is successfully found
    function onRouteFound(routeData) {
      currentRouteData = routeData;
      updateSaveButton(true);
    }
    
    // Call this when clearing the map
    function onClearMap() {
      currentRouteData = null;
      updateSaveButton(false);
    }
    
    // Function to clear all map overlays
    function clearMapOverlays() {
      if(currentPolyline) currentPolyline.setMap(null);
      markers.forEach(marker => marker.setMap(null));
      markers = [];
      onClearMap();
    }

    function addMarker(lat, lng, title, iconUrl, label) {
        const marker = new google.maps.Marker({
            position: {lat: lat, lng: lng},
            map: map,
            title: title,
            icon: iconUrl,
            label: label
        });
        markers.push(marker);
        return marker;
    }

    function getCoordinates(address) {
      return new Promise((resolve, reject) => {
        // Appending 'Accra, Ghana' to improve geocoding accuracy in this region
        geocoder.geocode({ address: address + ", Accra, Ghana" }, (results, status) => {
          if (status === "OK" && results[0]) {
            const loc = results[0].geometry.location;
            resolve({ lat: loc.lat(), lng: loc.lng() });
          } else {
            reject("Location not found: " + address);
          }
        });
      });
    }

    document.getElementById("searchBtn").addEventListener("click", async () => {
      const startTxt = document.getElementById("start").value;
      const endTxt = document.getElementById("end").value;
      const errorDiv = document.getElementById("errorMsg");
      const instructDiv = document.getElementById("instructions");
      const btn = document.getElementById("searchBtn");
      
      // Reset UI
      errorDiv.style.color = "#9ca3af";
      errorDiv.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
      instructDiv.innerHTML = "";
      btn.disabled = true;
      clearMapOverlays();

      try {
        // 1. Geocode
        const [startCoords, endCoords] = await Promise.all([
           getCoordinates(startTxt), getCoordinates(endTxt)
        ]);

        // 2. Call PHP API
        const response = await fetch('api.php', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            startLat: startCoords.lat, startLon: startCoords.lng,
            endLat: endCoords.lat, endLon: endCoords.lng
          })
        });

        const data = await response.json();
        btn.disabled = false;
        errorDiv.textContent = "";

        if(data.error || (data.result && data.result.error)) {
           errorDiv.style.color = "#ef4444";
           errorDiv.textContent = data.error || data.result.error;
           return;
        }

        // 3. Visualize
        const route = data.result;
        
        // Add start and end point markers (using the closest bus stops coordinates)
        addMarker(route.start_stop.lat, route.start_stop.lon, `Start: ${route.start_stop.name}`, 'http://maps.google.com/mapfiles/ms/icons/green-dot.png', 'A');
        addMarker(route.end_stop.lat, route.end_stop.lon, `End: ${route.end_stop.name}`, 'http://maps.google.com/mapfiles/ms/icons/red-dot.png', 'B');

        const bounds = new google.maps.LatLngBounds();
        bounds.extend({lat: route.start_stop.lat, lng: route.start_stop.lon});
        bounds.extend({lat: route.end_stop.lat, lng: route.end_stop.lon});

        // Display Instructions & Draw Route
        if(route.route_type === "Direct") {
            const leg = route.route; // Note the property name change from Python to PHP/JS access
            
            instructDiv.innerHTML = `
                <div class="leg-card">
                    <span class="leg-header">
                        <i class="fa-solid fa-bus"></i> Direct Route Found
                    </span>
                    <div class="leg-details">
                        Take **${leg.name}** to your destination.
                    </div>
                    <div class="leg-meta">
                        <span class="badge">Direct</span>
                        <span><i class="fa-solid fa-stop"></i> ${leg.stops.length} stops</span>
                        <span><i class="fa-solid fa-route"></i> ${route.total_distance_km} km</span>
                    </div>
                </div>
            `;
            
            // Draw Line
            const path = leg.stops.map(s => ({lat: s.lat, lng: s.lon}));
            currentPolyline = new google.maps.Polyline({
              path: path,
              geodesic: true,
              strokeColor: "#007afc", // Bright blue
              strokeOpacity: 1.0,
              strokeWeight: 6,
              map: map
            });

            // Zoom to fit
            path.forEach(p => bounds.extend(p));

        } else if (route.route_type === "Indirect" && Array.isArray(route.journey)) {
            // Indirect / Multi-leg
            let html = `
                <div style='margin-bottom:8px; font-weight:600; color:#fff;'>
                    <i class="fa-solid fa-route"></i> Route Details: 
                    ${route.transfers_needed} Transfers | 
                    ${route.total_distance_km} km Total
                </div>
            `;
            
            let polylinePath = [];
            const colors = ["#007afc", "#4CAF50", "#FFC107", "#E91E63", "#9C27B0"]; // Different colors for legs

            route.journey.forEach((leg, idx) => {
                const stops = leg.stops || [];
                const transferInfo = leg.transfer_at ? 
                    `<br/><span class='leg-details'><i class="fa-solid fa-right-left"></i> Transfer at: **${leg.transfer_at.name}**</span>` : 
                    '';

                html += `
                    <div class="leg-card" style="border-left-color: ${colors[idx % colors.length]};">
                        <span class="leg-header">
                            <i class="fa-solid fa-bus"></i> Leg ${idx+1}: Take **${leg.route_name}**
                        </span>
                        <div class="leg-meta">
                            <span class="badge" style="background: ${colors[idx % colors.length]}33; color: ${colors[idx % colors.length]};">Route ${idx+1}</span>
                            <span><i class="fa-solid fa-route"></i> ${leg.distance_km} km</span>
                            ${transferInfo}
                        </div>
                    </div>
                `;
                
                // Draw Line for the leg
                const legPath = stops.map(s => ({lat: s.lat, lng: s.lon}));
                if(legPath.length > 0) {
                    new google.maps.Polyline({
                        path: legPath,
                        geodesic: true,
                        strokeColor: colors[idx % colors.length], 
                        strokeOpacity: 1.0,
                        strokeWeight: 6,
                        map: map
                    });

                    // Extend bounds and add transfer marker
                    legPath.forEach(p => bounds.extend(p));
                    if (leg.transfer_at) {
                        addMarker(
                            leg.transfer_at.lat, 
                            leg.transfer_at.lon, 
                            `Transfer: ${leg.transfer_at.name}`, 
                            'http://maps.google.com/mapfiles/ms/icons/orange-dot.png', 
                            `T${idx + 1}`
                        );
                    }
                }
            });
            instructDiv.innerHTML = html;
            errorDiv.style.color = "#eab308"; // Yellow warning color
            errorDiv.textContent = `Indirect route found with ${route.transfers_needed} transfer(s).`;
        } else {
            errorDiv.style.color = "#ef4444";
            errorDiv.textContent = "No valid route or a specific error occurred: " + (route.error || "Unknown error.");
        }

        map.fitBounds(bounds);

      } catch (e) {
        console.error(e);
        btn.disabled = false;
        errorDiv.style.color = "#ef4444";
        errorDiv.textContent = "Error locating places or connecting to the service. Try being more specific.";
      }
    });
  </script>
  
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap&loading=async" async defer></script>
</body>
</html>
