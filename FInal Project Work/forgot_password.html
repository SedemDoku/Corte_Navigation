<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Reset Password | Corte Navigation</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

  <style>

    :root {
        --bg-dark: #0e1012;
        --bg-card: #17191c;
        --bg-input: #23262b;
        --text-main: #ffffff;
        --text-muted: #9ca3af;
        --primary: #007afc;
        --primary-hover: #0062ca; 
        --border: #2b2f36;
        --error: #ef4444;
        --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }


    body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-dark);
        color: var(--text-main);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
    }

    .bg-pattern {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: 
            linear-gradient(var(--bg-dark) 2px, transparent 2px),
            linear-gradient(90deg, var(--bg-dark) 2px, transparent 2px),
            linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 40px 40px, 40px 40px;
        z-index: -1;
    }

    .auth-card {
        width: 100%;
        max-width: 400px;
        padding: 40px;
        background: rgba(23, 25, 28, 0.85); 
        backdrop-filter: blur(12px); 
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        text-align: center;
    }

    h2 { margin-bottom: 8px; font-size: 1.5rem; letter-spacing: -0.5px; }
    .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; line-height: 1.5; }
    
    /* Input Styles */
    .input-group { position: relative; margin-bottom: 16px; text-align: left; }
    .input-group i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.9rem; pointer-events: none; }
    input { width: 100%; padding: 12px 12px 12px 40px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); font-size: 0.95rem; transition: border-color 0.2s; }
    input:focus { outline: none; border-color: var(--primary); }
    input::placeholder { color: #555; }

    /* Button Styles */
    button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 50px; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 8px; transition: background 0.2s, transform 0.1s; }
    button:hover { background: var(--primary-hover); }
    button:active { transform: scale(0.98); }
    button:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

    /* Footer Links */
    .meta { margin-top: 24px; font-size: 0.9rem; color: var(--text-muted); }
    a { color: var(--primary); text-decoration: none; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; transition: color 0.2s; }
    a:hover { text-decoration: underline; }

    /* Message Styles */
    .error { color: var(--error); font-size: 0.85rem; margin-top: 12px; min-height: 20px; }
    .success-msg { 
        color: var(--success); 
        font-size: 0.9rem; 
        margin-top: 12px; 
        background: rgba(16, 185, 129, 0.1); 
        padding: 10px; 
        border-radius: 6px; 
        border: 1px solid rgba(16, 185, 129, 0.2); 
        display: none; /* Hidden by default */
        text-align: left;
        line-height: 1.4;
    }
    .success-msg strong {
        color: var(--text-main);
        display: block;
        margin-bottom: 5px;
    }
  </style>
</head>
<body>

  <div class="bg-pattern"></div>

  <div class="auth-card">
    <h2>Reset Password</h2>
    <p class="subtitle">Enter the email associated with your account and we'll process the reset token.</p>

    <div class="input-group">
        <i class="fa-regular fa-envelope"></i>
        <input type="email" id="email" placeholder="name@gmail.com">
    </div>

    <button id="resetBtn">Send Reset Link</button>
    
    <div id="errorMsg" class="error"></div>
    <div id="successMsg" class="success-msg"></div>

    <p class="meta">
        <a href="login.html"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
    </p>
  </div>

  <script>
    document.getElementById("resetBtn").addEventListener("click", async () => {
        const email = document.getElementById("email").value;
        const error = document.getElementById("errorMsg");
        const success = document.getElementById("successMsg");
        const btn = document.getElementById("resetBtn");

        if(!email) { 
            error.textContent = "Please enter your email."; 
            return; 
        }

        // UI Loading State and Cleanup
        btn.textContent = "Processing...";
        btn.disabled = true;
        error.textContent = "";
        success.style.display = "none";
        success.innerHTML = ""; // Clear previous link/message

        try {
            // FIXED: Changed from 'send_reset.php' to correct file
            const res = await fetch('send_reset.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            });
            const data = await res.json();

            if (data.status === "success") {
                success.style.display = "block";
                
                // Change button to successful state
                btn.style.background = "var(--success)"; 
                btn.textContent = "Token Generated";
                btn.disabled = true; // Keep disabled after successful generation

                // *** CRITICAL CHANGE FOR DEMO ***
                if (data.debug_link) {
                    success.innerHTML = 
                        "<strong>✅ Token Generated Successfully!</strong>" +
                        "<p>Click the link below to verify the token and reset the password (Demo only):</p>" +
                        `<p><a href="${data.debug_link}" style="color: var(--primary); text-decoration: underline; font-weight: 600; word-break: break-all;">${data.debug_link}</a></p>`;
                } else {
                    // This handles the case where the email doesn't exist (security message)
                    success.innerHTML = "<p>If that email address is in our system, the reset token has been processed.</p>";
                }
                
            } else {
                error.textContent = data.message;
                btn.textContent = "Send Reset Link";
                btn.style.background = "var(--primary)";
                btn.disabled = false;
            }
        } catch (err) {
            error.textContent = "Connection error. Ensure your PHP server is running.";
            btn.textContent = "Send Reset Link";
            btn.style.background = "var(--primary)";
            btn.disabled = false;
        }
    });
  </script>
</body>
</html>
